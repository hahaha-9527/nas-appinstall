services:
  appinstall:
    image: python:3.12-slim-bookworm
    container_name: appinstall-app
    restart: unless-stopped
    # 必须 host 网络：安装器要调用宿主机 127.0.0.1:9004 的应用中心服务，端口也要直接对外
    network_mode: host
    working_dir: /opt/app
    environment:
      # 时区必须设：包列表与日志里的时间都按它走，不设会显示成 UTC
      - TZ=Asia/Shanghai
      - TPK_PORT=${TPK_PORT:-8978}
      # 下面三个数据路径同时用于「程序读的环境变量」与下方 volumes 的挂载，
      # 两处取同一个变量 —— 改了这里（或 .env）就一起改，不用再去动 volumes。
      - TPK_STORE=${TPK_STORE:-/userdata/tpk_local}
      - TPK_DB=${TPK_DB_DIR:-/userdata/db}/appstore.db
      - TPK_APPSTORE_API=${TPK_APPSTORE_API:-http://127.0.0.1:9004/appstoreApi}
      - TPK_DEFAULT_LOC=${TPK_DEFAULT_LOC:-/volume1}
      - TPK_WEBROOT=${TPK_WEBROOT:-/usr/local/pc}
      # 图标默认以 base64 内嵌进数据库（桌面 / 局域网 / 中转都能显示），一般不用配。
      # ⚠️ 手机 App 不渲染 data: 图标：想让手机也显示，在这里填**这台机器自己**
      # 的 HTTPS 前缀（形如 https://nas.example.com/pc，铁牛 NAS 即中转域名），
      # 重启（up -d --force-recreate）后图标地址自动切换，已装应用无需重装。
      - TPK_PUBLIC_BASE=${TPK_PUBLIC_BASE:-}
      - TPK_IMAGE_SIZE_KB=${TPK_IMAGE_SIZE_KB:-121437}
      # 访问口令：留空则首次打开页面时由访问者自行设置（不需要 root 权限）
      # 想固定下来就在这里填；填了会覆盖页面上设置的值
      - TPK_PASSWORD=${TPK_PASSWORD:-}
    volumes:
      # 应用中心数据库（注册 / 上架记录写这里）
      - ${TPK_DB_DIR:-/userdata/db}:${TPK_DB_DIR:-/userdata/db}
      # 上传的 .tpk、图标缓存与访问口令记录（.auth.json，不含明文）
      - ${TPK_STORE:-/userdata/tpk_local}:${TPK_STORE:-/userdata/tpk_local}
      # 图标副本另存一份到这里，方便在浏览器里人工核对（数据库里的地址不依赖它）
      - ${TPK_WEBROOT:-/usr/local/pc}:${TPK_WEBROOT:-/usr/local/pc}
      # 程序本体（只读挂载，改完 up -d 即生效）
      - ./app:/opt/app:ro
    command: ["sh", "/opt/app/run.sh"]
